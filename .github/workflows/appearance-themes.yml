name: Verificar definições de cores
on:
  push:
    branches: [appearance-themes]
    paths: ['dist/**', 'package.json', 'scripts/check-appearance.cjs', 'scripts/review-theme-colors.cjs']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar a aplicação e as três paletas
        run: npm test
      - run: git diff --check
      - run: npm install --no-save --package-lock=false sharp
      - name: Medir a referência oficial de cor
        continue-on-error: true
        run: node scripts/review-theme-colors.cjs
      - name: Guardar as referências
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .review/theme
          git diff --cached --quiet || git commit -m 'Guardar a referência de cor do MAGIS'
          git push origin HEAD:appearance-themes
