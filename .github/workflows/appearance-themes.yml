name: Preparar temas de cores
on:
  push:
    branches: [appearance-themes]
    paths: ['scripts/review-theme-colors.cjs']
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false sharp
      - run: node scripts/review-theme-colors.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .review/theme
          git diff --cached --quiet || git commit -m 'Confirmar cores nas referências oficiais'
          git push origin HEAD:appearance-themes
