name: Verificar imagens revistas
on:
  push:
    branches: [gallery-refinement-20261027]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false sharp
      - name: Preparar imagens verificadas
        run: node scripts/apply-gallery-refinement.cjs
      - name: Atualizar recursos offline
        run: node scripts/build-offline-manifest.cjs
      - name: Verificar aplicação completa
        run: npm test
      - name: Guardar imagens verificadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'Destacar Sullivan e acrescentar quatro obras nas fichas japonesas'
          git push origin HEAD:gallery-refinement-20261027
