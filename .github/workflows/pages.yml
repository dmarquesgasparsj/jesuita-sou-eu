name: Publicar aplicação no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter o código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar a aplicação e o modo offline
        run: npm test
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar os ficheiros públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    needs: check-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar a aplicação
        id: deployment
        uses: actions/deploy-pages@v4
