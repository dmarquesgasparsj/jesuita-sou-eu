name: Preparar referências faciais
on:
  push:
    branches: [review-facial-features-20261112]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false sharp
      - run: node scripts/rebuild-tone-references.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/assets dist/gallery.json dist/biography-photos.json scripts/descriptors scripts/portrait-sources.json source-portraits/inacio-azevedo.jpg .review/azevedo/final-crop.json
          git commit -m 'Preparar retrato de Azevedo e referências em luminância'
          git push origin HEAD:review-facial-features-20261112
