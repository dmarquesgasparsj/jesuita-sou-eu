name: Rever seis retratos
on:
  push:
    branches: [review-six-portraits-20261112]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false sharp
      - run: node scripts/apply-six-portraits.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist scripts/descriptors scripts/portrait-sources.json source-portraits .review/six
          git commit -m 'Atualizar seis retratos e referências'
          git push origin HEAD:review-six-portraits-20261112
