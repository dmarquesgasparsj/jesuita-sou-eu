name: Rever seis retratos
on:
  push:
    branches: [review-six-portraits-20261112]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/build-offline-manifest.cjs && npm test
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/offline-assets.json
          git commit -m 'Regenerar manifesto offline e verificar a galeria'
          git push origin HEAD:review-six-portraits-20261112
